<text x='645.0' y='353' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>세 변 합 160cm · 최장변 100cm</text>
<text x='645.0' y='372' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>총무게 20kg (택배 접수 한도)</text>
<text x='645.0' y='391' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>낱개 초과 시 OVERWEIGHT_ITEM</text>
<line x1='645' y1='310' x2='645' y2='260' stroke='#4A5568' stroke-width='1.6' marker-end='url(#ah)'/>
