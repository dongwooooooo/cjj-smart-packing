<defs><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L10,5 L0,10 z' fill='#4A5568'/></marker></defs>
<rect width='1300' height='510' fill='white'/>
<text x='40' y='40' text-anchor='start' font-size='18' font-weight='700' fill='#1A202C' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>그림 2. 출고지시 배치 처리 흐름</text>
<text x='40' y='64' text-anchor='start' font-size='12.5' font-weight='500' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>배치 1건이 한 트랜잭션으로 처리된다. 거부 주문 제외는 트랜잭션 안의 분기이며 부분 커밋이 아니다.</text>
<rect x='40' y='110' width='210' height='150' rx='8' fill='#F4F6F8' stroke='#4A5568' stroke-width='1.5'/>
<text x='145.0' y='134' text-anchor='middle' font-size='15' font-weight='600' fill='#1A202C' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>접수 · 검증</text>
<text x='145.0' y='153' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>요청 결함: 배치 전체 400</text>
<text x='145.0' y='172' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>주문별 거부 목록:</text>
<text x='145.0' y='191' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>미등록 지역 · 재고 부족</text>
<text x='145.0' y='210' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>초과 치수 · 초과 무게</text>
<text x='145.0' y='229' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>재전송 멱등: 주문번호 UNIQUE</text>
<rect x='290' y='110' width='210' height='150' rx='8' fill='#F4F6F8' stroke='#4A5568' stroke-width='1.5'/>
<text x='395.0' y='134' text-anchor='middle' font-size='15' font-weight='600' fill='#1A202C' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>블록화</text>
<text x='395.0' y='153' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>유효 내치수 = 내치수 − 마진 3cm</text>
<text x='395.0' y='172' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>파손주의: 완충재 두께 × 2 가산</text>
<text x='395.0' y='191' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>상품 무게 합산 (입고 시 저장값)</text>
<text x='395.0' y='210' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>적층불가 SKU는 단독 단위</text>
<rect x='540' y='110' width='210' height='150' rx='8' fill='#EBF4FF' stroke='#2B6CB0' stroke-width='1.5'/>
<text x='645.0' y='134' text-anchor='middle' font-size='15' font-weight='600' fill='#1A202C' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>배치 엔진</text>
<text x='645.0' y='153' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>extreme point 후보점</text>
<text x='645.0' y='172' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>축 평행 6방향 시도</text>
<text x='645.0' y='191' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>판정 = 실제 배치 구성</text>
<text x='645.0' y='210' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>무효 추천 없음</text>
<rect x='790' y='110' width='210' height='150' rx='8' fill='#EBF4FF' stroke='#2B6CB0' stroke-width='1.5'/>
<text x='895.0' y='134' text-anchor='middle' font-size='15' font-weight='600' fill='#1A202C' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>편성 최적화</text>
<text x='895.0' y='153' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>① 주문 전체 박스 1개 시도</text>
<text x='895.0' y='172' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>② FFD 초기해 (부피 내림차순)</text>
<text x='895.0' y='191' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>③ 국소 탐색: 이동 · 분리</text>
<text x='895.0' y='210' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>목적함수: 총 배송비 → 박스 수 → 부피</text>
