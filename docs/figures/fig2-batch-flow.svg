<text x='1145.0' y='353' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>실측 무게 입력</text>
<text x='1145.0' y='372' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>허용 오차 max(0.1kg, 3%)</text>
<text x='1145.0' y='391' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>벗어나면 WEIGHT_MISMATCH</text>
<line x1='1145' y1='260' x2='1145' y2='310' stroke='#4A5568' stroke-width='1.6' marker-end='url(#ah)' stroke-dasharray='6 5'/>
<text x='40' y='470' text-anchor='start' font-size='12.5' font-weight='500' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>확장성 실측: 주문 100 / 1,000 / 5,000건에서 주문당 p50 1.8 / 2.4 / 2.3ms, p95 12.8 / 12.9 / 13.8ms (단일 스레드, 순수 로직).</text>
