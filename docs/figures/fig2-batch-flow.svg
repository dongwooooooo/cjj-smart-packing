<text x='895.0' y='353' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>세 변 합 80/100/120/140/160cm</text>
<text x='895.0' y='372' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>무게 2/5/10/15/20kg</text>
<text x='895.0' y='391' text-anchor='middle' font-size='12.5' fill='#718096' font-family='Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif'>높은 쪽 구간으로 요금 결정</text>
